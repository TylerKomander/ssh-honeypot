# PRODUCTION — real internet-facing exposure. NOT the safe default.
# Read deploy/DEPLOY.md FIRST. Only run on a dedicated, throwaway, network-isolated host.
#
#   docker compose -f deploy/docker-compose.prod.yml up --build -d
#
# Differences from the sandbox compose:
#   - host networking  -> attacker's REAL src_ip is preserved (no bridge NAT/SNAT)
#   - listens on 0.0.0.0:22 -> where scanners actually knock (move your real sshd first)
#   - NET_BIND_SERVICE -> the only capability needed to bind port 22 as non-root

services:
  honeypot:
    build:
      context: ..
    container_name: ssh-honeypot
    restart: unless-stopped
    network_mode: host
    environment:
      HONEYPOT_HOST: "0.0.0.0"
      HONEYPOT_PORT: "22"
      HONEYPOT_LOG_DIR: "/data"
      HONEYPOT_HOST_KEY: "/data/host.key"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
